{{- if .Values.logApiService.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "log-monitor.logApiFullname" . }}-auth
  labels:
    {{- include "log-monitor.labels" . | nindent 4 }}
    app.kubernetes.io/component: log-api-service
type: Opaque
stringData:
  admin-password: {{ .Values.logApiService.admin.password | quote }}
  session-secret: {{ .Values.logApiService.admin.sessionSecret | quote }}
  influx-token: {{ .Values.logApiService.influx.token | quote }}
{{- end }}
