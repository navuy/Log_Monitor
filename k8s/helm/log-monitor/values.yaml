nameOverride: ""
fullnameOverride: ""

redis:
  enabled: true
  image:
    repository: redis
    tag: "7.4-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 6379
  resources: {}
  maxmemory: 256mb
  maxmemoryPolicy: allkeys-lru

k8sLogStreamer:
  enabled: true
  image:
    repository: k8s-log-streamer
    tag: dev
    pullPolicy: Never
  env:
    logDir: /var/log/containers
    streamKeyPrefix: logs:k8s
    streamMaxLen: "500"
    streamIdleTTL: 6h
    startFromEnd: "true"
    discoveryInterval: 10s
    readInterval: 1s
  resources: {}
  hostPaths:
    containers: /var/log/containers

testLogger:
  enabled: true
  namespace: test-logger
  image:
    repository: busybox
    tag: "1.36"
    pullPolicy: IfNotPresent
  intervalSeconds: 2
  resources: {}

logClassifier:
  enabled: true
  replicaCount: 2

  image:
    repository: log-classifier
    tag: dev
    pullPolicy: Never

  redisStreamGlob: "logs:k8s*"
  consumerGroup: "log-classifiers"
  discoverEvery: "10s"
  readBlock: "5s"
  startFromEnd: true
  claimEvery: "30s"
  claimMinIdle: "1m"
  ruleRefreshEvery: "15s"

  ignoredNamespaces: "log-monitor"
  resources: {}

  influx:
    url: "http://log-monitor-influxdb2:80"
    org: "log-monitor"
    bucket: "k8s-logs"
    token: "dev-token-change-me"

postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  auth:
    database: "logmonitor"
    user: "logmonitor"
    password: "logmonitor"
  service:
    port: 5432
  persistence:
    enabled: true
    size: 5Gi
    accessMode: ReadWriteOnce
    mountPath: /var/lib/postgresql/data
  resources: {}

logApiService:
  enabled: true
  image:
    repository: log-api-service
    tag: dev
    pullPolicy: Never
  service:
    type: ClusterIP
    port: 8080
  admin:
    username: admin
    password: admin
    sessionSecret: local-development-secret-change-me
  influx:
    url: "http://log-monitor-influxdb2:80"
    org: "log-monitor"
    bucket: "k8s-logs"
    token: "dev-token-change-me"
  resources: {}
  seedRules:
    - name: warning-keyword
      rule_type: keyword
      pattern: WARNING
      enabled: true
      namespace_scope: ""
      pod_scope: ""
      container_scope: ""
    - name: error-keyword
      rule_type: keyword
      pattern: ERROR
      enabled: true
      namespace_scope: ""
      pod_scope: ""
      container_scope: ""

ui:
  enabled: true
  replicaCount: 1
  image:
    repository: log-monitor-ui
    tag: dev
    pullPolicy: Never
  service:
    type: ClusterIP
    port: 8080
  resources: {}


influxdb2:
  enabled: true

  image:
    repository: influxdb
    tag: "2.7"
    pullPolicy: IfNotPresent

  adminUser:
    organization: "log-monitor"
    bucket: "k8s-logs"
    user: "admin"
    password: "admin123456"
    token: "dev-token-change-me"

  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 10Gi
    mountPath: /var/lib/influxdb2

  service:
    type: ClusterIP
    port: 80
    targetPort: 8086
