{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "log-monitor.postgresFullname" . }}-auth
  labels:
    {{- include "log-monitor.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
stringData:
  database: {{ .Values.postgres.auth.database | quote }}
  user: {{ .Values.postgres.auth.user | quote }}
  password: {{ .Values.postgres.auth.password | quote }}
{{- end }}
